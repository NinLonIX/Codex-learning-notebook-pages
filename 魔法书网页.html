<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#c6d7ee" />
  <title>Codex指南｜章节阅读模板</title>
  <style>
    :root {
      --ink: #26324a;
      --ink-soft: #66728b;
      --mist: #eef4fb;
      --mist-deep: #d9e5f4;
      --lavender: #dcd7f4;
      --lilac: #a99edc;
      --blue: #7a9cc6;
      --gold: #c4a56a;
      --gold-soft: rgba(196, 165, 106, .45);
      --paper: #fffdf9;
      --paper-tint: #f8f7fb;
      --shadow: rgba(56, 67, 98, .18);
      --shadow-deep: rgba(55, 67, 101, .28);
      --serif: "Iowan Old Style", "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --sans: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: #e9f0f8; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--sans);
      background:
        radial-gradient(circle at 17% 14%, rgba(255,255,255,.95) 0 1px, transparent 2px),
        radial-gradient(circle at 77% 18%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 63% 72%, rgba(177, 192, 227, .45) 0 1px, transparent 2px),
        linear-gradient(135deg, #edf5fb 0%, #e9e7f7 48%, #f7f3fa 100%);
      background-size: 180px 180px, 240px 240px, 310px 310px, auto;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid rgba(122, 156, 198, .8); outline-offset: 4px; }
    .site { width: min(1280px, 100%); margin: 0 auto; padding: 24px clamp(16px, 4vw, 52px) 38px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; color: var(--ink-soft); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    .topbar-brand { display: flex; align-items: center; gap: 11px; }
    .topbar-mark { width: 24px; height: 24px; border: 1px solid var(--gold); border-radius: 50%; position: relative; box-shadow: inset 0 0 0 4px rgba(255,255,255,.45); }
    .topbar-mark::after { content: ""; position: absolute; inset: 6px; border: 1px solid var(--lilac); border-radius: 50%; }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .topbar-note { letter-spacing: .05em; text-transform: none; }
    .reset-button { border: 1px solid rgba(122, 156, 198, .35); background: rgba(255,255,255,.46); color: var(--ink-soft); border-radius: 999px; padding: 8px 13px; cursor: pointer; transition: .2s ease; }
    .reset-button:hover { border-color: var(--lilac); color: var(--ink); background: rgba(255,255,255,.8); }
    .book-stage { perspective: 1800px; }
    .book { position: relative; width: 100%; max-width: 1160px; min-height: 720px; margin: 0 auto; transform-style: preserve-3d; transition: filter .25s ease; }
    .book::before { content: ""; position: absolute; inset: 14px 1.2% 10px; border-radius: 28px; background: linear-gradient(105deg, rgba(166, 153, 211, .42), rgba(255,255,255,.7) 47%, rgba(159, 177, 211, .42)); filter: blur(16px); opacity: .62; z-index: -2; }
    .book::after { content: ""; position: absolute; left: 50%; top: 4%; bottom: 4%; width: 2px; transform: translateX(-1px); background: linear-gradient(180deg, transparent, rgba(155, 145, 176, .26) 12%, rgba(155, 145, 176, .44) 50%, rgba(155, 145, 176, .2) 88%, transparent); z-index: 3; pointer-events: none; }
    .book-pages { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 720px; border-radius: 28px; position: relative; overflow: hidden; box-shadow: 0 24px 60px var(--shadow-deep), 0 4px 16px rgba(71, 87, 124, .12); background: var(--paper); }
    .page { min-width: 0; position: relative; overflow: hidden; background: linear-gradient(90deg, rgba(219, 213, 205, .23), transparent 4%, transparent 96%, rgba(219, 213, 205, .13)), repeating-linear-gradient(0deg, rgba(155, 145, 176, .03) 0, rgba(155, 145, 176, .03) 1px, transparent 1px, transparent 4px), var(--paper); }
    .page-left { padding: clamp(34px, 5vw, 68px) clamp(28px, 4vw, 62px) 58px; border-right: 1px solid rgba(164, 158, 178, .18); }
    .page-right { padding: clamp(34px, 5vw, 68px) clamp(28px, 4vw, 62px) 58px; background: linear-gradient(90deg, rgba(187, 180, 192, .12), transparent 5%, transparent 94%, rgba(187, 180, 192, .1)), var(--paper-tint); }
    .page::before, .page::after { content: ""; position: absolute; pointer-events: none; opacity: .5; }
    .page-left::before { width: 130px; height: 130px; top: 32px; left: 28px; border: 1px solid rgba(196, 165, 106, .32); border-radius: 50%; box-shadow: 0 0 0 10px rgba(196, 165, 106, .04), 0 0 0 22px rgba(196, 165, 106, .03); }
    .page-left::after { width: 78px; height: 78px; bottom: 62px; right: 36px; border: 1px solid rgba(169, 158, 220, .32); transform: rotate(25deg); }
    .page-right::before { width: 170px; height: 170px; top: -70px; right: -70px; border: 1px solid rgba(169, 158, 220, .26); border-radius: 50%; box-shadow: 0 0 0 11px rgba(169, 158, 220, .04), 0 0 0 23px rgba(169, 158, 220, .03); }
    .page-right::after { width: 88px; height: 1px; left: 48px; bottom: 34px; background: linear-gradient(90deg, transparent, var(--gold-soft), transparent); }
    .eyebrow { position: relative; z-index: 1; color: var(--blue); font-size: 11px; letter-spacing: .19em; text-transform: uppercase; }
    .book-title { position: relative; z-index: 1; margin: 86px 0 12px; font: 500 clamp(42px, 5.1vw, 78px)/1.08 var(--serif); letter-spacing: .04em; color: #323b59; }
    .book-title::after { content: "✦"; display: inline-block; margin-left: 15px; color: var(--gold); font: 24px/1 var(--sans); vertical-align: top; transform: translateY(-4px); }
    .book-subtitle { position: relative; z-index: 1; max-width: 340px; margin: 0; color: var(--ink-soft); font: 17px/1.8 var(--serif); }
    .book-intro { position: relative; z-index: 1; max-width: 385px; margin: 50px 0 0; color: #75819a; font-size: 14px; line-height: 1.9; }
    .book-meta { position: absolute; left: clamp(28px, 4vw, 62px); bottom: 54px; z-index: 1; display: grid; gap: 8px; color: var(--ink-soft); font-size: 12px; letter-spacing: .04em; }
    .book-meta strong { color: var(--ink); font-weight: 600; }
    .wax-seal { position: absolute; right: clamp(28px, 5vw, 66px); bottom: 45px; display: grid; place-items: center; width: 86px; height: 86px; border: 1px solid rgba(169, 158, 220, .55); border-radius: 50%; color: var(--lilac); font-size: 24px; background: rgba(255,255,255,.46); box-shadow: 0 10px 20px rgba(169, 158, 220, .16), inset 0 0 0 7px rgba(255,255,255,.45); }
    .wax-seal small { display: block; margin-top: -16px; font-size: 8px; letter-spacing: .16em; color: var(--ink-soft); }
    .page-kicker { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--blue); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    .page-kicker em { color: var(--gold); font-style: normal; letter-spacing: .06em; }
    .index-heading { margin: 78px 0 28px; font: 500 clamp(30px, 3.8vw, 47px)/1.2 var(--serif); color: #35415f; }
    .chapter-list { display: grid; gap: 10px; position: relative; z-index: 1; }
    .chapter-card { width: 100%; display: grid; grid-template-columns: 48px minmax(0, 1fr) 22px; align-items: center; gap: 12px; padding: 14px 12px 14px 0; border: 0; border-bottom: 1px solid rgba(164, 158, 178, .28); background: transparent; color: var(--ink); text-align: left; text-decoration: none; cursor: pointer; transition: .24s ease; }
    .chapter-card:hover { padding-left: 8px; padding-right: 4px; background: rgba(232, 232, 247, .38); }
    .chapter-number { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--gold-soft); border-radius: 50%; color: var(--gold); font: 13px var(--mono); }
    .chapter-card h3 { margin: 0 0 4px; font: 500 19px/1.25 var(--serif); }
    .chapter-card p { margin: 0; color: var(--ink-soft); font-size: 12px; line-height: 1.6; }
    .chapter-arrow { color: var(--lilac); font-size: 21px; transition: transform .2s ease; }
    .chapter-card:hover .chapter-arrow { transform: translateX(4px); }
    .chapter-card.is-unavailable { color: #a5aabe; cursor: default; opacity: .62; }
    .chapter-card.is-unavailable:hover { padding-left: 0; padding-right: 12px; background: transparent; }
    .chapter-card.is-unavailable .chapter-arrow { color: #b6bac8; font-size: 11px; letter-spacing: .04em; }
    .index-hint { margin-top: 34px; color: #8791a7; font-size: 12px; line-height: 1.7; display: flex; align-items: center; gap: 9px; }
    .index-hint::before { content: ""; width: 28px; height: 1px; background: var(--gold-soft); }
    .chapter-page-left { display: flex; flex-direction: column; }
    .chapter-label { color: var(--blue); font: 11px var(--mono); letter-spacing: .13em; }
    .chapter-title { margin: 30px 0 14px; font: 500 clamp(34px, 4.2vw, 58px)/1.15 var(--serif); color: #35415f; }
    .chapter-subtitle { margin: 0; color: var(--ink-soft); font: 17px/1.7 var(--serif); }
    .chapter-summary { margin: 40px 0 0; padding: 17px 18px; border-left: 2px solid var(--gold); background: rgba(245, 242, 251, .7); color: #68738b; font-size: 13px; line-height: 1.8; }
    .quote-card { margin-top: auto; padding-top: 22px; color: #71809c; font: italic 18px/1.7 var(--serif); }
    .quote-card::before { content: "“"; display: block; height: 19px; color: var(--gold); font: 35px/1 var(--serif); }
    .tag-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 23px; }
    .tag { padding: 5px 9px; border: 1px solid rgba(169, 158, 220, .35); border-radius: 999px; color: var(--lilac); font-size: 11px; background: rgba(255,255,255,.45); }
    .chapter-page-right { display: flex; flex-direction: column; height: 720px; }
    .chapter-scroll { position: relative; z-index: 1; flex: 0 0 560px; min-height: 0; height: 560px; overflow-y: auto; padding-right: 14px; scrollbar-width: thin; scrollbar-color: rgba(169,158,220,.65) transparent; }
    .chapter-scroll::-webkit-scrollbar { width: 6px; }
    .chapter-scroll::-webkit-scrollbar-thumb { background: rgba(169,158,220,.56); border-radius: 99px; }
    .mobile-chapter-head { display: none; }
    .imported-note { color: #5f6b82; font-family: var(--serif); }
    .imported-note .note-source { margin: 0 0 24px; color: #8b94a7; font: 12px/1.7 var(--sans); }
    .imported-note .note-source a { color: var(--blue); text-decoration-color: rgba(122,156,198,.45); text-underline-offset: 3px; }
    .imported-note-section { margin: 0 0 30px; }
    .imported-note-section h3 { margin: 0 0 13px; color: var(--blue); font: 600 15px/1.5 var(--sans); letter-spacing: .04em; }
    .imported-note-section p { margin: 0 0 14px; color: #5f6b82; font: 16px/2 var(--serif); }
    .imported-note-section ul { margin: 8px 0 15px; padding-left: 22px; color: #5f6b82; font: 15px/1.9 var(--serif); }
    .imported-note-section li { margin: 4px 0; }
    .note-callout { margin: 13px 0 16px; padding: 15px 17px; border-left: 2px solid var(--gold); border-radius: 0 12px 12px 0; background: rgba(245,242,251,.78); color: #56627b; font: 600 17px/1.75 var(--serif); }
    .note-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: 14px 0 18px; color: #66738b; font: 14px/1.5 var(--sans); }
    .note-flow span { padding: 7px 10px; border: 1px solid rgba(169,158,220,.35); border-radius: 9px; background: rgba(255,255,255,.6); }
    .note-flow b { color: var(--gold); font-weight: 500; }
    .note-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; margin: 14px 0 17px; }
    .note-grid div { padding: 11px 12px; border: 1px solid rgba(169,158,220,.25); border-radius: 10px; background: rgba(255,255,255,.48); color: #65718a; font: 13px/1.65 var(--sans); }
    .note-grid strong { display: block; margin-bottom: 3px; color: #4c5b76; font-weight: 600; }
    .note-compare { display: grid; gap: 8px; margin: 14px 0 17px; }
    .note-compare div { padding: 10px 12px; border-left: 2px solid rgba(169,158,220,.5); background: rgba(246,244,251,.66); color: #65718a; font: 14px/1.75 var(--serif); }
    .note-compare strong { color: #50607c; font-family: var(--sans); font-size: 12px; }
    .note-warning { margin: 14px 0 17px; padding: 14px 16px; border: 1px solid rgba(196,165,106,.45); border-radius: 12px; background: rgba(255,251,240,.78); color: #6b6670; font: 15px/1.8 var(--serif); }
    .note-code { margin: 14px 0 17px; padding: 14px 16px; border-radius: 11px; background: #2f3b55; color: #eef3fb; font: 14px/1.7 var(--mono); overflow-x: auto; }
    .note-code code { font: inherit; }
    .note-inline-code { padding: 2px 5px; border-radius: 5px; background: rgba(169,158,220,.14); color: #62608c; font: .88em var(--mono); }
    .note-divider { margin: 31px 0 25px; display: flex; align-items: center; gap: 12px; color: var(--gold); font: 15px var(--serif); }
    .note-divider::before, .note-divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-soft)); }
    .note-divider::after { transform: scaleX(-1); }
    .reading-lead { margin: 0 0 25px; color: #52617a; font: 600 18px/1.8 var(--serif); }
    .reading-section { margin: 0 0 25px; }
    .reading-section h3 { margin: 0 0 10px; color: var(--blue); font: 600 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
    .reading-section p { margin: 0 0 15px; color: #5f6b82; font: 16px/2 var(--serif); }
    .reading-points { display: grid; gap: 9px; margin: 10px 0 0; padding: 0; list-style: none; }
    .reading-points li { position: relative; padding-left: 20px; color: #66728a; font: 15px/1.8 var(--serif); }
    .reading-points li::before { content: "✦"; position: absolute; left: 0; color: var(--gold); font-size: 11px; top: 2px; }
    .spell-card { margin-top: 29px; padding: 17px 18px; border: 1px solid rgba(196, 165, 106, .42); border-radius: 13px; background: linear-gradient(135deg, rgba(255,252,244,.95), rgba(246,243,252,.9)); }
    .spell-card small { color: var(--gold); font: 11px var(--mono); letter-spacing: .13em; }
    .spell-card p { margin: 9px 0 0; color: #5b6680; font: 16px/1.75 var(--serif); }
    .page-foot { position: absolute; bottom: 24px; left: clamp(28px, 4vw, 62px); right: clamp(28px, 4vw, 62px); display: flex; justify-content: space-between; align-items: center; color: #a3a9b8; font: 11px var(--mono); letter-spacing: .08em; }
    .page-foot .line { width: 34px; height: 1px; background: var(--gold-soft); }
    .book-controls { display: flex; align-items: center; justify-content: center; gap: 13px; min-height: 58px; margin-top: 17px; }
    .book-controls[hidden] { display: none; }
    .control-button { border: 1px solid rgba(122, 156, 198, .35); background: rgba(255,255,255,.65); color: var(--ink); border-radius: 999px; padding: 10px 16px; cursor: pointer; transition: .2s ease; }
    .control-button:hover:not(:disabled) { background: rgba(255,255,255,.95); border-color: var(--lilac); transform: translateY(-1px); }
    .control-button:disabled { opacity: .38; cursor: not-allowed; }
    .control-button.primary { border-color: rgba(196, 165, 106, .58); color: #8f7440; }
    .progress-dots { display: flex; align-items: center; gap: 6px; margin: 0 7px; }
    .progress-dot { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: rgba(169, 158, 220, .35); cursor: pointer; }
    .progress-dot.active { width: 19px; border-radius: 999px; background: var(--lilac); }
    .book.turn-next .page-right { animation: turnNext .78s cubic-bezier(.72,.05,.23,.98); transform-origin: left center; }
    .book.turn-prev .page-left { animation: turnPrev .78s cubic-bezier(.72,.05,.23,.98); transform-origin: right center; }
    @keyframes turnNext { 0% { transform: rotateY(0); box-shadow: none; } 45% { transform: rotateY(-92deg); box-shadow: -20px 0 27px rgba(58, 67, 96, .22); } 100% { transform: rotateY(0); box-shadow: none; } }
    @keyframes turnPrev { 0% { transform: rotateY(0); box-shadow: none; } 45% { transform: rotateY(92deg); box-shadow: 20px 0 27px rgba(58, 67, 96, .22); } 100% { transform: rotateY(0); box-shadow: none; } }
    @media (max-width: 860px) {
      .site { padding-top: 17px; }
      .topbar-note { display: none; }
      .book, .book-pages { min-height: 0; }
      .book-pages { grid-template-columns: 1fr; overflow: visible; }
      .book::after { display: none; }
      .page-left, .page-right { padding: 31px 24px 58px; min-height: 520px; }
      .page-left { border-right: 0; border-bottom: 1px solid rgba(164, 158, 178, .18); }
      .book-title { margin-top: 63px; font-size: clamp(38px, 10vw, 62px); }
      .index-heading { margin-top: 39px; }
      .page-right.chapter-page-right { min-height: 560px; height: 560px; }
      .chapter-scroll { flex-basis: 430px; height: 430px; }
      .quote-card { margin-top: 34px; }
      .page-foot { left: 24px; right: 24px; }
      .wax-seal { bottom: 31px; right: 24px; width: 70px; height: 70px; }
      .book-meta { left: 24px; bottom: 33px; }
    }
    @media (max-width: 520px) {
      .site { padding-left: 11px; padding-right: 11px; }
      .topbar { margin-bottom: 11px; }
      .topbar-brand { font-size: 10px; }
      .page-left, .page-right { padding-left: 19px; padding-right: 19px; }
      .chapter-card { grid-template-columns: 40px minmax(0, 1fr) 18px; gap: 9px; }
      .chapter-number { width: 36px; height: 36px; font-size: 11px; }
      .chapter-card h3 { font-size: 17px; }
      .chapter-card p { font-size: 11px; }
      .control-button { padding: 9px 12px; font-size: 13px; }
      .progress-dots { gap: 4px; margin: 0 2px; }
      .progress-dot { width: 6px; height: 6px; }
      .progress-dot.active { width: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="site">
    <header class="topbar">
      <div class="topbar-brand"><span class="topbar-mark" aria-hidden="true"></span><span id="topbarTitle">The Luminous Archive</span></div>
      <div class="topbar-actions">
        <span class="topbar-note">Codex 站点目录 · 点击章节跳转页面</span>
        <button class="reset-button" id="resetBook" type="button">回到扉页</button>
      </div>
    </header>

    <section class="book-stage" aria-label="清透梦幻魔法书">
      <div class="book" id="book" data-view="index">
        <div class="book-pages" id="bookPages">
          <section class="page page-left" id="leftPage" aria-label="魔法书左页"></section>
          <section class="page page-right" id="rightPage" aria-live="polite" aria-label="魔法书右页"></section>
        </div>
        <nav class="book-controls" id="bookControls" aria-label="章节导航" hidden></nav>
      </div>
    </section>
  </main>

  <script>
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    const BOOK = {
      title: "Codex指南",
      subtitle: "AI 编程代理入门地图与实践手册",
      author: "雾光档案馆",
      version: "Edition 01 · 2026",
      intro: "这里可以放一段关于这本书的引言。它既可以是一部故事，也可以是一份课程、手册、作品集，或任何值得被慢慢阅读的内容。",
      chapters: [
        {
          number: "01", href: "Codex入门学霸笔记.html", title: "Codex 是什么？", subtitle: "AI 编程代理入门地图：四种入口、能力边界与第一次自检",
          summary: "把现有的 Codex 入门学霸笔记收进第一章，从认识代理、选择入口到完成第一次自检。",
          quote: "先有地图，再开始赶路。",
          tags: ["Codex", "入门", "AI 编程代理"],
          lead: "Codex 是 OpenAI 的 AI 编程代理：你给它一个目标，它可以理解项目、读取文件、执行命令、修改代码、运行测试，再把结果和 diff 交回来给你验收。",
          customHtml: `
            <div class="imported-note">
              <p class="note-source">来源：<a href="https://coding.stormzhang.ai/codex/01-what-is-codex" target="_blank" rel="noreferrer">AI 编程指南 · 01 认识 Codex 与四种入口</a> ｜ 更新 2026.06.20</p>
              <section class="imported-note-section">
                <h3>01 · 先记住这一句话</h3>
                <div class="note-callout">Codex = OpenAI 的 AI 编程代理</div>
                <p>你给它一个目标，它可以理解项目、读取文件、执行命令、修改代码、运行测试，再把结果和 diff 交回来给你验收。它的关键区别是：<strong>不只回答“怎么写”，还会进入工作现场把任务做完</strong>。</p>
                <p>可以把两者这样区分：<strong>ChatGPT</strong> 像坐在指挥部的参谋，给建议和方案；<strong>Codex</strong> 像能到项目现场执行的搭档，负责把目标落成可检查的改动。</p>
              </section>
              <section class="imported-note-section">
                <h3>02 · 它能帮你做什么？</h3>
                <div class="note-flow"><span>描述目标</span><b>→</b><span>理解项目</span><b>→</b><span>动手修改</span><b>→</b><span>测试并交付</span></div>
                <ul>

      `;
      document.getElementById("backToIndex").addEventListener("click", () => switchToIndex("prev"));
      document.getElementById("prevChapter").addEventListener("click", () => switchToChapter(index - 1, "prev"));
      document.getElementById("nextChapter").addEventListener("click", () => switchToChapter(index + 1, "next"));
      controls.querySelectorAll("[data-dot-index]").forEach((dot) => {
        dot.addEventListener("click", () => {
          const nextIndex = Number(dot.dataset.dotIndex);
          if (nextIndex !== state.active) switchToChapter(nextIndex, nextIndex > state.active ? "next" : "prev");
        });
      });
      const scrollArea = rightPage.querySelector(".chapter-scroll");
      if (scrollArea) {
        const savedScrollTop = Number(state.scrollPositions[String(index)] || 0);
        scrollArea.scrollTop = savedScrollTop;
        scrollArea.addEventListener("scroll", () => saveScrollPosition(index), { passive: true });
        window.requestAnimationFrame(() => { scrollArea.scrollTop = savedScrollTop; });
      }
      window.scrollTo({ top: 0, left: 0, behavior: "auto" });
      localStorage.setItem(STORAGE_KEY, String(index));
    }

    function switchToChapter(index, direction) {
      if (state.turning || index < 0 || index >= BOOK.chapters.length) return;
      saveScrollPosition();
      state.turning = true;
      const animationClass = direction === "prev" ? "turn-prev" : "turn-next";
      book.classList.add(animationClass);
      const finish = () => {
        renderChapter(index);
        book.classList.remove(animationClass);
        state.turning = false;
      };
      if (isReducedMotion()) finish();
      else {
        window.setTimeout(finish, 360);
        window.setTimeout(() => book.classList.remove(animationClass), 800);
      }
    }

    function switchToIndex(direction = "prev") {
      if (state.turning || state.view === "index") return;
      saveScrollPosition();
      state.turning = true;
      const animationClass = direction === "next" ? "turn-next" : "turn-prev";
      book.classList.add(animationClass);
      const finish = () => {
        renderIndex();
        book.classList.remove(animationClass);
        state.turning = false;
      };
      if (isReducedMotion()) finish();
      else {
        window.setTimeout(finish, 360);
        window.setTimeout(() => book.classList.remove(animationClass), 800);
      }
    }

    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input, textarea, select, [contenteditable='true']")) return;
      if (event.key === "Escape") { switchToIndex("prev"); return; }
      if (state.view !== "chapter") return;
      if (event.key === "ArrowRight") switchToChapter(state.active + 1, "next");
      if (event.key === "ArrowLeft") switchToChapter(state.active - 1, "prev");
    });

    book.addEventListener("touchstart", (event) => {
      state.touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    book.addEventListener("touchend", (event) => {
      if (state.view !== "chapter" || state.turning) return;
      const distance = event.changedTouches[0].clientX - state.touchStartX;
      if (Math.abs(distance) < 48) return;
      if (distance < 0) switchToChapter(state.active + 1, "next");
      else switchToChapter(state.active - 1, "prev");
    }, { passive: true });

    resetButton.addEventListener("click", () => switchToIndex("prev"));
    window.addEventListener("pagehide", () => saveScrollPosition());

    renderIndex();
  </script>
</body>
</html>
